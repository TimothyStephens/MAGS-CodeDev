# Configuration

api_keys:
  openai: "sk-..."
  anthropic: "sk-ant-..."
  gemini: "AIza..."
  ollama: "ollama-api-key-..."  # For local providers (ollama, vLLM, LM Studio)

models:
  # ===================================================================
  # == INTERACTIVE COMMAND AGENTS
  # ===================================================================
  # These models are used by `init`, `chat`, and `debug` commands.
  interactive_commands:
    chat:
      provider: "openai"
      model: "gpt-4o"

  # ===================================================================
  # == BUILD WORKFLOW AGENTS
  # ===================================================================
  # These models are used by the `mags-codedev build` command.
  build_workflow:
    # The heavy lifter. Use your strongest model with the largest token
    # allowance here (e.g., gpt-4o, claude-3.5-sonnet, gemini-2.5-pro).
    coder:
      provider: "openai"
      model: "gpt-4o"

    tester:
      provider: "anthropic"
      model: "claude-3-5-sonnet-20240620"

    log_checker:
      provider: "google"
      model: "gemini-2.5-pro"

    # Add as many models as you want for code review. The LangGraph will
    # execute these concurrently and aggregate their feedback.
    reviewers:
      - provider: "openai"
        model: "gpt-4o"
      - provider: "google"
        model: "gemini-2.5-pro"
      - provider: "anthropic"
        model: "claude-3-5-sonnet-20240620"
      # --- Local LLM Examples (pick one that matches your setup) ---

      # Option 1: Ollama (native ChatOllama, requires langchain-ollama)
      #   pip install langchain-ollama
      # - provider: "ollama"
      #   model: "llama3.1"  # Must match Ollama's model name
      #   base_url: "http://localhost:11434"  # Default; omit if using default
      #   num_ctx: 8192  # Optional: context window size

      # Option 2: Any OpenAI-compatible server (vLLM, LM Studio, Ollama /v1)
      #   No extra pip install needed; uses ChatOpenAI under the hood
      # - provider: "local"
      #   model: "Qwen2.5-72B"
      #   base_url: "http://localhost:8000/v1"  # vLLM or LM Studio port

      # Option 3: custom_openai (same as 'local', legacy name)
      # - provider: "custom_openai"
      #   model: "llama3:70b"
      #   base_url: "http://localhost:11434/v1"  # Ollama OpenAI-compatible endpoint
      #   api_key: "ollama"  # Dummy key to satisfy LangChain client

settings:
  language: "python" # Target language: 'python' (others coming soon)
  
  # Container runtime for isolated test execution.
  # 'auto' (default): auto-detects best available (podman > docker > apptainer > singularity > local).
  # Explicit options: 'podman', 'docker', 'apptainer', 'singularity', 'local'.
  test_runner: "auto"
  
  # How many modules to build concurrently
  max_parallel_modules: 4
  
  # Budgets for fix/review cycles (set to 0 for unlimited)
  max_test_fix_iterations: 5  # Max test/lint fix attempts before aborting
  max_review_rounds: 3  # Max review revision rounds before aborting
  
  # Container image names (auto-built if not found)
  docker_test_image: "mags-dev-env:latest"
  apptainer_test_image: "mags-dev-env.sif"
  
  # Max wall-clock time per module test/lint run (minutes)
  timeout_per_module_mins: 15
  
  # Base artifact directory (logs, worktrees, artifacts)
  base_dir: ".mags-codedev"
  
  # Logging level: 'info', 'debug', 'trace'
  log_level: "info"

